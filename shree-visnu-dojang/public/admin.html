<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coach Admin | Shree Visnu Taekwondo Dojang</title>
    <link rel="stylesheet" href="/styles.css?v=20261115-responsive" />
  </head>
  <body>
    <div class="page-shell admin-shell">

      <!-- Login View -->
      <div id="login-section">
        <h2>Coach Login</h2>
        <p class="admin-intro">Sign in to access trial inquiries and student management.</p>
        <form id="login-form" class="admin-login-form">
          <input type="email" id="login-email" placeholder="Coach Email" required />
          <input type="password" id="login-password" placeholder="Password" required />
          <button type="submit" class="primary-btn">Login to Dashboard</button>
          <p id="login-error" class="admin-error"></p>
        </form>
      </div>

      <!-- Dashboard View (Hidden until logged in) -->
      <div id="dashboard-section" style="display: none;">
        <div class="admin-header">
          <div>
            <p class="eyebrow accent">Admin Portal</p>
            <h2>Shree Visnu Dojang Management</h2>
          </div>
          <button id="logout-btn" class="secondary-btn">Log Out</button>
        </div>

        <h3>Trial Class Inquiries</h3>
        <p class="admin-subtitle">Real-time submissions from your website form.</p>

        <div id="inquiries-list" class="admin-inquiries">
          <p style="color: var(--muted);">Loading inquiries...</p>
        </div>

        <div class="admin-back-link">
          <a href="/" class="secondary-btn">&larr; Back to Public Website</a>
        </div>
      </div>

    </div>

    <script type="module" src="/public/admin.js?v=20261115-admin-table"></script>
  </body>
</html>
